# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml

kind: hosted
name: customer-service-agent
description: >
  Hosted support agent demo that downloads shared skills and connects to Foundry toolboxes.
metadata:
  authors:
    - Microsoft
  tags:
    - Foundry Hosted Agent
    - Foundry Shared Skills
    - Foundry Toolboxes
protocols:
  - protocol: responses
    version: "2.0.0"
environment_variables:
  - name: FOUNDRY_PROJECT_ENDPOINT
    value: ${FOUNDRY_PROJECT_ENDPOINT}
  - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
  - name: SKILL_NAMES
    value: ${SKILL_NAMES}
  - name: TOOLBOX_NAMES
    value: ${TOOLBOX_NAMES}
  - name: TOOLBOX_ENDPOINTS
    value: ${TOOLBOX_ENDPOINTS}
resources:
  cpu: "0.5"
  memory: "1Gi"
