# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0-beta.4'
name: foundry-hosted-agents-skills-demo
services:
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                format: OpenAI
                name: gpt-5.4-mini
                version: "2026-03-17"
              name: gpt-5.4-mini
              sku:
                capacity: 10
                name: GlobalStandard
    customer-service-agent:
        project: .
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        codeConfiguration:
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Hosted support agent that uses Foundry-shared skills and toolboxes.
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            - name: FOUNDRY_PROJECT_ENDPOINT
              value: ${FOUNDRY_PROJECT_ENDPOINT}
            - name: TOOLBOX_NAMES
              value: ${TOOLBOX_NAMES}
            - name: TOOLBOX_ENDPOINTS
              value: ${TOOLBOX_ENDPOINTS}
            - name: SKILL_NAMES
              value: ${SKILL_NAMES}
        kind: hosted
        metadata:
            tags:
                - Foundry Hosted Agent
                - Foundry Shared Skills
                - Foundry Toolboxes
                - Agent Framework
                - Teaching Demo
        name: customer-service-agent
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
  provider: microsoft.foundry
